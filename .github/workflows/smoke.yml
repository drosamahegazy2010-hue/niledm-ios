name: Simulator check (screenshots)

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/smoke.yml", "ios/**"]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: macos-15-intel   # Apple-silicon runners are short on capacity today
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"; xcodebuild -version
      - run: brew install xcodegen
      - name: Build for the iPhone simulator
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project NileDM.xcodeproj -scheme NileDM -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO build > sim.log 2>&1 \
            || { grep -E "error:" sim.log | sort -u | head -50; tail -40 sim.log; exit 1; }
      - name: Run it on a simulated iPhone and take screenshots
        working-directory: ios
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone") and "Pro Max" in x["name"]] or [x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(c[-1]["udid"])')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array ar
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale ar_EG
          xcrun simctl shutdown "$UDID"; xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          APP=build/Build/Products/Debug-iphonesimulator/NileDM.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant photos-add eg.niledm.browser || true
          mkdir -p shots www
          # test page with two videos: a direct mp4 and an HLS stream
          cat > www/video.html <<'HTML'
          <!doctype html><html><head><meta name="viewport" content="width=device-width"><title>NileDM video test</title></head>
          <body style="font-family:-apple-system;margin:12px"><h2>Video test</h2>
          <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls playsinline style="width:100%"></video>
          <p>Second video (HLS):</p>
          <video src="https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8" controls playsinline style="width:100%"></video>
          </body></html>
          HTML
          (cd www && python3 -m http.server 8765 --bind 127.0.0.1 > ../shots/server.txt 2>&1 &)
          sleep 2
          PAGE="http://127.0.0.1:8765/video.html"
          APPID=eg.niledm.browser

          # 1) Arabic: the page with a download button on each video
          xcrun simctl launch "$UDID" $APPID -appLanguage ar -NDMOpen "$PAGE"
          sleep 75
          xcrun simctl io "$UDID" screenshot shots/1-ar-video-buttons.png
          xcrun simctl terminate "$UDID" $APPID

          # 2) English: tap the button on the first video (mp4), then look at the downloads list and settings
          xcrun simctl launch "$UDID" $APPID -appLanguage en -NDMOpen "$PAGE" -NDMTapVideo
          sleep 60
          xcrun simctl io "$UDID" screenshot shots/2-en-video-buttons.png
          sleep 15
          xcrun simctl terminate "$UDID" $APPID
          xcrun simctl launch "$UDID" $APPID -appLanguage en -NDMScreen 1
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/3-en-downloads.png
          xcrun simctl terminate "$UDID" $APPID
          xcrun simctl launch "$UDID" $APPID -appLanguage en -NDMScreen 2
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/4-en-settings.png
          xcrun simctl terminate "$UDID" $APPID
          xcrun simctl launch "$UDID" $APPID -appLanguage ar -NDMScreen 2
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/5-ar-settings.png
          xcrun simctl terminate "$UDID" $APPID

          # 3) HLS stream download -> MP4
          HLS="https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8"
          xcrun simctl launch "$UDID" $APPID -appLanguage ar -NDMSelfTest "$HLS"
          sleep 150
          xcrun simctl io "$UDID" screenshot shots/6-ar-hls.png

          DATA=$(xcrun simctl get_app_container "$UDID" $APPID data)
          ls -la "$DATA/Documents/Downloads" > shots/files.txt 2>&1 || true
          cp "$DATA/Library/Application Support/NileDM/downloads.json" shots/downloads.json || true
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "NileDM" OR process == "nsurlsessiond"' 2>/dev/null > all.log || true
          grep -E "NileDM:" all.log | cut -c1-600 > shots/log.txt || true
          cat shots/files.txt shots/log.txt
      - name: Publish screenshots
        if: always()
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la shots || exit 0
          find shots -type f -empty -delete
          gh release view smoke-test >/dev/null 2>&1 || gh release create smoke-test --title "Simulator check" --notes "Automatic screenshots from the iPhone simulator" --prerelease
          gh release upload smoke-test shots/* --clobber
